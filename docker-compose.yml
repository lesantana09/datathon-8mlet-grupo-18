services:
  api:
    build: .
    ports:
      - "8081:8081"
    volumes:
      - ./data/processed:/app/data/processed:ro
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy
    command:
      - uvicorn
      - datathon_mlet.api.entrypoints.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8081"

  mlflow:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
    environment:
      - MLFLOW_SERVER_ALLOWED_HOSTS=mlflow:5000,localhost:5000,127.0.0.1:5000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:5000")
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////app/mlruns/mlflow.db
      - --artifacts-destination
      - file:/app/mlruns/artifacts
