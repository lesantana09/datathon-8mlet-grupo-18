global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "datathon-8mlet-grupo-18"
    static_configs:
      - targets: ["api:8081"]
        labels:
          environment: "local"
          application: "datathon-8mlet-grupo-18"
  - job_name: "datathon-8mlet-grupo-18-grafana"
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          environment: "local"
          application: "datathon-8mlet-grupo-18"
  - job_name: "datathon-8mlet-grupo-18-loki"
    static_configs:
      - targets: ["loki:3100"]
        labels:
          environment: "local"
          application: "datathon-8mlet-grupo-18"
