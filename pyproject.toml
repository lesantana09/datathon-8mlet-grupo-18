[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datathon-mlet"
version = "0.1.0"
description = "Estrutura inicial do Datathon de Machine Learning Engineering da FIAP POSTECH."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "mlflow>=2.19",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.10",
    "scikit-learn>=1.5",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = [
    "httpx2",
    "jupyter>=1.1",
    "kagglehub>=0.3",
    "matplotlib>=3.9",
    "pre-commit>=3.8",
    "python-dotenv>=1.0",
    "pytest>=8.3",
    "ruff>=0.9",
    "seaborn>=0.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
